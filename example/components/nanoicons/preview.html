<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Font preview</title>
<style>
 :root { color-scheme: light dark; --background: #fff; --foreground: #111; --muted: #666; --border: #eee; --surface: #fff; --surface-hover: #f7f7f7; }
@media (prefers-color-scheme: dark) {
 :root { --background: #181818; --foreground: #f5f5f5; --muted: #aaa; --border: #444; --surface: #222; --surface-hover: #2d2d2d; }
}
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial; padding: 16px; background: var(--background); color: var(--foreground); }
.font-block { margin-bottom: 40px; }
.sample { font-family: inherit; font-size: 28px; display:inline-flex; flex-direction:column; justify-content:center; width:7rem; min-height:5rem; text-align:center; border:1px solid var(--border); margin:2px; padding:6px; line-height:2.5rem; box-sizing:border-box; cursor:pointer; background:var(--surface); color:var(--foreground); }
.sample:hover { border-color:var(--muted); background:var(--surface-hover); }
.icon-name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:12px system-ui, sans-serif; line-height:1.2; color:var(--muted); }
.copied { color:#35b86f; }
.grid { display:flex; flex-wrap:wrap; max-width: 100%; }
.header { display:flex; align-items:center; gap:12px; }
</style>
</head>

<script>
document.querySelectorAll('[data-icon-name]').forEach((icon) => {
	icon.addEventListener('click', async () => {
		const name = icon.dataset.iconName;
		if (!name) return;
		try {
			await navigator.clipboard.writeText(name);
			const label = icon.querySelector('.icon-name');
			if (label) {
				const original = label.textContent;
				label.textContent = 'Copied!';
				label.classList.add('copied');
				setTimeout(() => {
					label.textContent = original;
					label.classList.remove('copied');
				}, 900);
			}
		} catch {
			window.prompt('Copy icon name:', name);
		}
	});
});
</script>
